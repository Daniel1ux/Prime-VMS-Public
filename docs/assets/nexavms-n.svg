<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 137 124" width="137" height="124">
  <!-- N do NexaVMS (desenho mestre). Uma fita só: a faixa diagonal tem pontas em semicírculo
       (centros (26.5,24.5) e (113,98.5), raio 14.9) e a borda de fora de cada haste é tangente a elas.
       As dobras aparecem só pela sombra dentro da silhueta, que termina na quina interna de cada perna.
       Não editar à mão: ver docs/72-identidade-nexavms. -->
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="136" y1="0" x2="0" y2="124">
      <stop offset="0" stop-color="#D3F046"/><stop offset=".5" stop-color="#C5E82E"/><stop offset="1" stop-color="#B5DA20"/>
    </linearGradient>
    <linearGradient id="shadowLeft" gradientUnits="userSpaceOnUse" x1="38.8" y1="54.6" x2="24.0" y2="24.5"><stop offset="0" stop-color="#1E2A00" stop-opacity="0"/><stop offset="1" stop-color="#1E2A00" stop-opacity=".46"/></linearGradient>
    <linearGradient id="shadowRight" gradientUnits="userSpaceOnUse" x1="94.9" y1="63.4" x2="112.9" y2="100.2"><stop offset="0" stop-color="#1E2A00" stop-opacity="0"/><stop offset="1" stop-color="#1E2A00" stop-opacity=".40"/></linearGradient>
    <linearGradient id="creaseLeft" gradientUnits="userSpaceOnUse" x1="25" y1="42.8" x2="21.4" y2="47"><stop offset="0" stop-color="#1E2A00" stop-opacity=".32"/><stop offset="1" stop-color="#1E2A00" stop-opacity="0"/></linearGradient>

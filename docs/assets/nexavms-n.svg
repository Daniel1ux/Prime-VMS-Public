  </defs>
  <use href="#silhouette" fill="url(#base)"/>
  <g clip-path="url(#shape)">
    <path fill="url(#shadowLeft)" d="M-5 17.13 L60 72.74 L34 107.2 L-31 51.6 Z"/>
